AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Architectures:
    - arm64
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: FBPService
Parameters:
  Year:
    Type: String
    Default: '2026'
  CloudFrontDomain:
    Type: String
    Default: my-fbp.com
  PdfLoggingBucketName:
    Type: String
    Default: fbp-pdf-logging
  FBPWeeklyResultsWeekIndexName:
    Type: String
    Default: WeekIndex
  S3BucketName:
    Type: String
    Default: my-fbp.com
  SESBucketName:
    Type: String
    Default: my-fbp-inbound-email
  ForwardToEmail:
    Type: String
    Description: External email address to forward emails to
    Default: chuckschwing@proton.me
  FromEmail:
    Type: String
    Description: Verified SES identity to send from
    Default: fbpadmin@my-fbp.com
  CompanyName:
    Type: String
    Default: FBP
  BaseUrl:
    Type: String
    Default: https://my-fbp.com
  SupportEmail:
    Type: String
    Description: Support email address for the company
    Default: fbpadmin@my-fbp.com
  TwilioPhoneNumber:
    Type: String
    Description: Originating Twilio phone number in E.164 format (e.g., +1234567890)
    Default: '+16093012328'
    AllowedPattern: ^\+[1]\d{1,11}$
  TwilioCredentialsSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing Twilio credentials
    Default: arn:aws:secretsmanager:us-east-1:768286545465:secret:TWILIO_SECRET-a6Y1ZP
  TwilioSecret:
    Type: String
    Description: JSON string containing Twilio credentials (Account SID and Auth Token
      and Twilio Phone number).
    Default: Twilio-Secret
  KnowledgeBaseId:
    Type: String
    Description: ID of the Bedrock Knowledge Base
    Default: FLBWAWSNBG
  DataSourceId:
    Type: String
    Description: ID of the Bedrock data source
    Default: LULFE6CQPM
Resources:
  FBPHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowHeaders:
        - content-type
        - x-amz-date
        - authorization
        - x-api-key
        - x-amz-security-token
        AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        AllowOrigins:
        - '*'
        MaxAge: 300
    Metadata:
      SamResourceId: FBPHttpApi
  MyApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      DomainName: my-fbp.com
      ApiId:
        Ref: FBPHttpApi
      Stage:
        Ref: FBPHttpApiprodStage
    Metadata:
      SamResourceId: MyApiMapping
  DynamoDBLogsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${Year}-Log
      TableClass: STANDARD
      AttributeDefinitions:
      - AttributeName: level
        AttributeType: S
      - AttributeName: timestamp
        AttributeType: S
      KeySchema:
      - AttributeName: level
        KeyType: HASH
      - AttributeName: timestamp
        KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
    Metadata:
      SamResourceId: DynamoDBLogsTable
  DynamoDBFBPUsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${Year}-FBP-Users
      TableClass: STANDARD
      AttributeDefinitions:
      - AttributeName: email
        AttributeType: S
      KeySchema:
      - AttributeName: email
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
    Metadata:
      SamResourceId: DynamoDBFBPUsersTable
  DynamoDBScheduleTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${Year}-Schedule
      TableClass: STANDARD
      AttributeDefinitions:
      - AttributeName: Week
        AttributeType: N
      - AttributeName: GameId
        AttributeType: S
      KeySchema:
      - AttributeName: Week
        KeyType: HASH
      - AttributeName: GameId
        KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
    Metadata:
      SamResourceId: DynamoDBScheduleTable
  DynamoDBFBPConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${Year}-FBP-Config
      TableClass: STANDARD
      AttributeDefinitions:
      - AttributeName: Week
        AttributeType: N
      KeySchema:
      - AttributeName: Week
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      DeletionProtectionEnabled: true
    Metadata:
      SamResourceId: DynamoDBFBPConfigTable
  DynamoDBFBPPicksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${Year}-FBP-Picks
      TableClass: STANDARD
      AttributeDefinitions:
      - AttributeName: email
        AttributeType: S
      - AttributeName: Week
        AttributeType: N
      KeySchema:
      - AttributeName: email
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
      - IndexName: WeekIndex
        KeySchema:
        - AttributeName: Week
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
    Metadata:
      SamResourceId: DynamoDBFBPPicksTable
  DynamoDBFBPSMSOptOutsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${Year}-FBP-SMS-Opt-Outs
      TableClass: STANDARD
      AttributeDefinitions:
      - AttributeName: phone_number
        AttributeType: S
      KeySchema:
      - AttributeName: phone_number
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
    Metadata:
      SamResourceId: DynamoDBFBPSMSOptOutsTable
  DynamoDBFBPWeeklyResultsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${Year}-FBP-Weekly-Results
      TableClass: STANDARD
      AttributeDefinitions:
      - AttributeName: email
        AttributeType: S
      - AttributeName: Week
        AttributeType: N
      KeySchema:
      - AttributeName: email
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
      - IndexName: WeekIndex
        KeySchema:
        - AttributeName: Week
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
    Metadata:
      SamResourceId: DynamoDBFBPWeeklyResultsTable
  DynamoDBFBPPayoutLedgerTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${Year}-FBP-Payout-Ledger
      TableClass: STANDARD
      AttributeDefinitions:
      - AttributeName: RecordType
        AttributeType: S
      - AttributeName: Timestamp
        AttributeType: S
      KeySchema:
      - AttributeName: RecordType
        KeyType: HASH
      - AttributeName: Timestamp
        KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
    Metadata:
      SamResourceId: DynamoDBFBPPayoutLedgerTable
  DynamoDBFBPRecordTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${Year}-Record
      TableClass: STANDARD
      AttributeDefinitions:
      - AttributeName: TeamName
        AttributeType: S
      KeySchema:
      - AttributeName: TeamName
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
    Metadata:
      SamResourceId: DynamoDBFBPRecordTable
  TransactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${Year}-Transactions
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
      - AttributeName: transactionId
        AttributeType: S
      - AttributeName: timestamp
        AttributeType: S
      KeySchema:
      - AttributeName: transactionId
        KeyType: HASH
      - AttributeName: timestamp
        KeyType: RANGE
    Metadata:
      SamResourceId: TransactionsTable
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
        - my-fbp.com
        - www.my-fbp.com
        Origins:
        - Id: S3WebsiteOrigin
          DomainName: my-fbp.com.s3-website-us-east-1.amazonaws.com
          CustomOriginConfig:
            HTTPPort: 80
            OriginProtocolPolicy: http-only
        - Id: ApiGatewayOrigin
          DomainName:
            Fn::Sub: ${FBPHttpApi}.execute-api.${AWS::Region}.amazonaws.com
          CustomOriginConfig:
            HTTPSPort: 443
            OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods:
          - GET
          - HEAD
        CacheBehaviors:
        - PathPattern: /prod/*
          TargetOriginId: ApiGatewayOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          - PUT
          - POST
          - PATCH
          - DELETE
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:768286545465:certificate/f93ac44f-bcd3-4ab9-95b0-c22d185f9259
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
    Metadata:
      SamResourceId: CloudFrontDistribution
  Route53ARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: my-fbp.com.
      Name: my-fbp.com.
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
          - CloudFrontDistribution
          - DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false
    Metadata:
      SamResourceId: Route53ARecord
  Route53AAAARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: my-fbp.com.
      Name: my-fbp.com.
      Type: AAAA
      AliasTarget:
        DNSName:
          Fn::GetAtt:
          - CloudFrontDistribution
          - DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false
    Metadata:
      SamResourceId: Route53AAAARecord
  FBPLibLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: fbplib
      Description: Shared FBP Python utility library
      ContentUri: s3://my-fbp.com/a907d6de3a0e2dcde55dbaec74ddfd7a
      CompatibleRuntimes:
      - python3.12
    Metadata:
      BuildMethod: python3.12
      SamResourceId: FBPLibLayer
  TwilioLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: twilio-layer
      Description: Twilio Python SDK
      ContentUri: s3://my-fbp.com/d6b4d3b40f50cb098cb06799eeea9516
      CompatibleRuntimes:
      - python3.12
    Metadata:
      SamResourceId: TwilioLayer
  TwilioWebHook:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-twilio-webhook
      CodeUri: s3://my-fbp.com/ad75a54c573126d86fd0a527482aed88
      Handler: TwilioWebHook.lambda_handler
      Runtime: python3.12
      Layers:
      - Ref: FBPLibLayer
      - Ref: TwilioLayer
      Environment:
        Variables:
          TwilioOptOutTableName:
            Fn::Sub: ${Year}-FBP-SMS-Opt-Outs
          FBPLogsTableName:
            Fn::Sub: ${Year}-Log
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Year}-FBP-SMS-Opt-Outs
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Year}-Log
      Events:
        TwilioWebHookPost:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /twilio-webhook
            Method: post
            PayloadFormatVersion: '2.0'
        TwilioWebHookOptionsApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /twilio-webhook
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
    Metadata:
      SamResourceId: TwilioWebHook
  WeasyprintLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: weasyprint-layer
      Description: WeasyPrint HTML to PDF
      ContentUri: s3://my-fbp.com/ccdd7fbb140a714aaf357317ac9ee380
      CompatibleRuntimes:
      - python3.12
      CompatibleArchitectures:
      - arm64
    Metadata:
      SamResourceId: WeasyprintLayer
  HTMLtoPDF:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-html-to-pdf
      CodeUri: s3://my-fbp.com/5f046ecd1a9cecef912208e650b8f1e4
      Handler: HTMLtoPDF.lambda_handler
      Runtime: python3.12
      Layers:
      - Ref: FBPLibLayer
      - Ref: WeasyprintLayer
      Environment:
        Variables:
          S3BucketName:
            Ref: S3BucketName
          PDFLoggingBucket:
            Ref: PdfLoggingBucketName
          FONTCONFIG_PATH: /opt/fonts
          FONTCONFIG_FILE: /opt/fonts/fonts.conf
          LD_LIBRARY_PATH: /opt/lib
          CloudFrontDomain:
            Ref: CloudFrontDomain
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - s3:PutObject
          - s3:GetObject
          Resource:
          - Fn::Sub: arn:aws:s3:::${S3BucketName}/*
          - Fn::Sub: arn:aws:s3:::${PdfLoggingBucketName}/*
      Events:
        HTMLtoPDFPostApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /htmlToPdf
            Method: post
            PayloadFormatVersion: '2.0'
        HTMLtoPDFOptionsApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /htmlToPdf
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
    Metadata:
      SamResourceId: HTMLtoPDF
  ChatBot:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-chatbot
      CodeUri: s3://my-fbp.com/654f1c2ad46ead2acc14bcf8d852aa42
      Handler: ChatBot.chatbot
      Runtime: python3.12
      Layers:
      - Ref: FBPLibLayer
      Environment:
        Variables:
          KnowledgeBaseId:
            Ref: KnowledgeBaseId
          DataSourceId:
            Ref: DataSourceId
          S3BucketName:
            Ref: S3BucketName
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - bedrock:RetrieveAndGenerate
          - bedrock:Retrieve
          - bedrock:AgenticRetrieveStream
          Resource: '*'
        - Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource: arn:aws:logs:*:*:*
        - Effect: Allow
          Action:
          - s3:PutObject
          - s3:GetObject
          Resource:
            Fn::Sub: arn:aws:s3:::${S3BucketName}/*
      Events:
        ChatBotPostApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /chatbot
            Method: post
            PayloadFormatVersion: '2.0'
    Metadata:
      SamResourceId: ChatBot
  ChatBotSync:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-chatbotsync
      CodeUri: s3://my-fbp.com/1e73022b254d3c7144f536448dbf4a00
      Handler: ChatBotSync.export_dynamodb_to_kb
      Runtime: python3.12
      Layers:
      - Ref: FBPLibLayer
      Environment:
        Variables:
          KnowledgeBaseId:
            Ref: KnowledgeBaseId
          DataSourceId:
            Ref: DataSourceId
          S3BucketName:
            Ref: S3BucketName
          FBPScheduleTableName:
            Fn::Sub: ${Year}-Schedule
          FBPUsersTableName:
            Fn::Sub: ${Year}-FBP-Users
          FBPConfigTableName:
            Fn::Sub: ${Year}-FBP-Config
          FBPPicksTableName:
            Fn::Sub: ${Year}-FBP-Picks
          FBPLogsTableName:
            Fn::Sub: ${Year}-Log
          FBPWeeklyResultsTableName:
            Fn::Sub: ${Year}-FBP-Weekly-Results
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Year}-Schedule
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Year}-FBP-Users
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Year}-FBP-Picks
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Year}-Log
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Year}-FBP-Weekly-Results
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:Scan
          - dynamodb:GetItem
          Resource: '*'
        - Effect: Allow
          Action:
          - bedrock:RetrieveAndGenerate
          - bedrock:Retrieve
          - bedrock:AgenticRetrieveStream
          - bedrock:StartIngestionJob
          - bedrock:DescribeIngestionJob
          - bedrock:ListIngestionJobs
          - bedrock:GetIngestionJob
          Resource:
          - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
          - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:data-source/${DataSourceId}
        - Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource: arn:aws:logs:*:*:*
        - Effect: Allow
          Action:
          - s3:PutObject
          - s3:GetObject
          Resource:
            Fn::Sub: arn:aws:s3:::${S3BucketName}/*
      Events:
        ChatBotSyncPostApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /chatbotsync
            Method: post
            PayloadFormatVersion: '2.0'
        ChatBotSyncOptionsApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /chatbotsync
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
    Metadata:
      SamResourceId: ChatBotSync
  GetCurrentWeek:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-get-current-week
      CodeUri: s3://my-fbp.com/9ab96812011a18831e835e9e6dc8f885
      Handler: GetCurrentWeek.lambda_handler
      Runtime: python3.12
      Layers:
      - Ref: FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName:
            Fn::Sub: ${Year}-FBP-Config
          FBPLogsTableName:
            Fn::Sub: ${Year}-Log
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Year}-FBP-Config
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Year}-Log
      Events:
        GetCurrentWeekPostApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /getCurrentWeek
            Method: post
            PayloadFormatVersion: '2.0'
        GetCurrentWeekOptionsApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /getCurrentWeek
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
    Metadata:
      SamResourceId: GetCurrentWeek
  UpdateTeamRecords:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-update-team-records
      CodeUri: s3://my-fbp.com/a7be47b77f6bc3303826d8152945fc53
      Handler: UpdateTeamRecords.lambda_handler
      Runtime: python3.12
      Layers:
      - Ref: FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName:
            Fn::Sub: ${Year}-FBP-Config
          FBPLogsTableName:
            Fn::Sub: ${Year}-Log
          DynamoDBFBPRecordTable:
            Fn::Sub: ${Year}-Record
          FBPScheduleTableName:
            Fn::Sub: ${Year}-Schedule
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Year}-FBP-Config
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Year}-Log
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Year}-Schedule
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Year}-Record
      Events:
        TeamRecordGetApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /updateTeamRecords
            Method: get
            PayloadFormatVersion: '2.0'
        TeamRecordOptionsApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /updateTeamRecords
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
    Metadata:
      SamResourceId: UpdateTeamRecords
  GetTeamRecords:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-get-team-records
      CodeUri: s3://my-fbp.com/1bb5df62b62ca1abaeef5bef0b892214
      Handler: GetTeamRecords.lambda_handler
      Runtime: python3.12
      Layers:
      - Ref: FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName:
            Fn::Sub: ${Year}-FBP-Config
          FBPLogsTableName:
            Fn::Sub: ${Year}-Log
          DynamoDBFBPRecordTable:
            Fn::Sub: ${Year}-Record
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Year}-FBP-Config
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Year}-Log
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Year}-Record
      Events:
        GetTeamRecordsApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /getTeamRecords
            Method: get
            PayloadFormatVersion: '2.0'
        GetTeamRecordsOptionsApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FBPHttpApi
            Path: /getTeamRecords
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
    Metadata:
      SamResourceId: GetTeamRecords
  FBPPayoutLedger:
    Type: AWS::Serverless::Function
    Properties:
